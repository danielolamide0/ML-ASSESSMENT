[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "severity-triage"
version = "0.1.0"
description = "Predict complaint severity (1-6) and the progress / do-not-progress triage decision"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "shap>=0.44",
    "joblib>=1.3",
    "openpyxl>=3.1",
]

[project.scripts]
severity-train = "severity_triage.train:main"
severity-predict = "severity_triage.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
